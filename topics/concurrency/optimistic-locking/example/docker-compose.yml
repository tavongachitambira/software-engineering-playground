# Postgres 16 for the optimistic-locking exercise.
#   docker compose up -d
# schema.sql runs automatically, but only on the FIRST init of the data volume.
# After editing it: docker compose down -v && docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
